DEFAULT omarchy
TIMEOUT 1

# Arch Linux ARM + Omarchy on the SD card's second partition (MBR disk ID
# 0x15715700). The initramfs logs to the FAT partition (/logs) and
# switch_roots. panic=10 reboots; a reboot not flagged "recovery" returns to
# stock Android.
LABEL omarchy
  LINUX /Image
  INITRD /initramfs.cpio.gz
  FDT /dtbs/rockchip-rk3326-frame157.dtb
  APPEND root=PARTUUID=15715700-02 rootwait rw console=tty1 ignore_loglevel panic=10

# Debug shell on the USB ACM console (initramfs/init), no root filesystem.
LABEL firstboot
  LINUX /Image
  INITRD /initramfs.cpio.gz
  FDT /dtbs/rockchip-rk3326-frame157.dtb
  APPEND rdinit=/init ignore_loglevel panic=-1 oops=panic
